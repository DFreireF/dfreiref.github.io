{{ define "main" }}
<article class="coffee-recipe">
  <header>
    <h1>{{ .Title }}</h1>
    <div class="meta">
      <p><strong>Method:</strong> {{ .Params.method }}</p>
      <p><strong>Grind Size:</strong> {{ .Params.grind_size }}</p>
      <p><strong>Coffee Used:</strong> {{ .Params.coffee }}</p>
      <p><strong>Temperature:</strong> {{ .Params.temperature }}</p>
      <p><strong>Time:</strong> {{ .Params.time }}</p>
    </div>
  </header>
  <section class="recipe-content">
    {{ .Content }}
    <h2>Steps</h2>
    <ol>
      {{ range .Params.steps }}
        <li>{{ . }}</li>
      {{ end }}
    </ol>
  </section>
</article>
{{ end }}
